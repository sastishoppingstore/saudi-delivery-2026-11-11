<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiasta Driver — السائق</title>
<link rel="stylesheet" href="/shared/fiasta.css">
<style>
  .offer-card { border: 2px solid var(--blue); position: relative; }
