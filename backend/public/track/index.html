<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiasta — تتبع البوليصة | Track waybill</title>
<link rel="stylesheet" href="/shared/fiasta.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar"><div class="logo">F</div><h1>Fiasta — <span id="ttl">تتبع البوليصة</span></h1></div>
  <div class="page">
    <div class="card">
      <label class="f">رقم البوليصة / Waybill number</label>
      <input id="wb" dir="ltr" placeholder="FIA-251101-0001" style="text-align:center;font-weight:700">
      <div style="height:12px"></div>
      <button class="btn" onclick="track()">🔍 تتبع / Track</button>
    </div>
    <div id="result"></div>
  </div>
</div>
<script src="/shared/app.js"></script>
<script>
async function track() {
  const wb = document.getElementById('wb').value.trim();
  const out = document.getElementById('result');
  if (!wb) return;
  try {
    const r = await FIA.api('/track/' + encodeURIComponent(wb));
    out.innerHTML = `<div class="card fade-in">
      <div class="row between"><b>${FIA.esc(r.waybill)}</b><span class="status-chip st-${r.status}">${FIA.statusLabel(r.status)}</span></div>
      <div class="small muted" style="margin:6px 0">${FIA.esc(r.district)} • ${FIA.esc(r.estimatedWindow)}</div>
      <div class="timeline">${r.events.map((e) => `<div class="ev"><b class="small">${FIA.statusLabel(e.status)}</b>
        <div class="small muted">${new Date(e.at + 'Z').toLocaleString()}</div></div>`).join('')}</div></div>`;
  } catch (e) {
    out.innerHTML = `<div class="empty"><div class="ic">🔍</div>${FIA.esc(e.message)}</div>`;
  }
}
document.getElementById('ttl').textContent = FIA.store.lang === 'ar' ? 'تتبع البوليصة' : 'Track waybill';
</script>
</body>
</html>
